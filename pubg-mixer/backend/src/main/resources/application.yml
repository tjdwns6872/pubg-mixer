spring:
  datasource:
    url: jdbc:mysql://db:3306/mixer?serverTimezone=Asia/Seoul&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
    username: mixer
    password: mixer
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
      
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# --- SpringDoc OpenAPI ---
springdoc:
  swagger-ui:
    path: /swagger-ui.html        # 접속 경로 (기본값도 동일)
    groups-order: DESC            # API 그룹 정렬 방식
  api-docs:
    path: /v3/api-docs            # OpenAPI 명세서(JSON) 경로
  default-consumes-media-type: application/json
  default-produces-media-type: application/json